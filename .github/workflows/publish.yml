name: brew pr-pull
on:
  pull_request_target:
    types:
      - labeled

permissions: {}

jobs:
  pr-pull:
    if: |
      contains(github.event.pull_request.labels.*.name, 'pr-pull') &&
      contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.sender.association)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: read
      packages: read
    env:
      HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW }}
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@56e6e1830b3c103b917ea1a7d175dcf99b62e6fc # master 2026-05-12

      - name: Set up git
        uses: Homebrew/actions/git-user-config@56e6e1830b3c103b917ea1a7d175dcf99b62e6fc # master 2026-05-12

      - name: Pull bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.actor }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: brew pr-pull --debug --tap="$GITHUB_REPOSITORY" "$PULL_REQUEST" --artifact-pattern "bottles-*"

      - name: Push commits
        uses: Homebrew/actions/git-try-push@56e6e1830b3c103b917ea1a7d175dcf99b62e6fc # master 2026-05-12
        with:
          token: ${{ github.token }}
          branch: main

      - name: Delete branch
        if: github.event.pull_request.head.repo.fork == false
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: git push --delete origin "$BRANCH"
